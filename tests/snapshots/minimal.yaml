        spec:
          
          terminationGracePeriodSeconds: 30
          securityContext:
            fsGroup: 20020
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: homeassistant-config-sync
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: home-assistant
                topologyKey: kubernetes.io/hostname
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: sync
              image: ghcr.io/runlix/git:0.1.0-stable@sha256:cf13c4af02e2c133a15a3d6746fc7890f9171bc749f7931253b34ec4727caa04
