apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-assistant
  namespace: home-automation
  labels:
    app.kubernetes.io/component: prometheus-rule
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: home-automation
    app.kubernetes.io/version: 2026.2.3
    helm.sh/chart: home-assistant-0.0.15
spec:
  groups:
    - name: home-assistant.rules
      rules:
        - alert: HomeAssistantDown
          annotations:
            description: Home Assistant service is unavailable for more than 5 minutes.
            summary: Home Assistant service is down
          expr: up{job=~".*home-assistant.*", namespace="home-automation"} == 0
          for: 5m
          labels:
            component: homeassistant
            service: homeassistant
            severity: critical
        - alert: HomeAssistantHighMemoryUsage
          annotations:
            description: Home Assistant pod {{ $labels.pod }} memory usage is above 85% for
              more than 5 minutes.
            summary: Home Assistant high memory usage
          expr: |
            (
              container_memory_working_set_bytes{
                pod=~"home-assistant.*",
                namespace="home-automation"
              }
              /
              on(pod, namespace)
              kube_pod_container_resource_limits{
                resource="memory",
                pod=~"home-assistant.*",
                namespace="home-automation"
              }
            ) * 100 > 85
          for: 5m
          labels:
            component: homeassistant
            service: homeassistant
            severity: warning
        - alert: HomeAssistantHighCPUUsage
          annotations:
            description: Home Assistant pod {{ $labels.pod }} CPU usage is above 80% for more
              than 5 minutes.
            summary: Home Assistant high CPU usage
          expr: |
            (
              rate(container_cpu_usage_seconds_total{
                pod=~"home-assistant.*",
                namespace="home-automation"
              }[5m])
              /
              on(pod, namespace)
              kube_pod_container_resource_limits{
                resource="cpu",
                pod=~"home-assistant.*",
                namespace="home-automation"
              }
            ) * 100 > 80
          for: 5m
          labels:
            component: homeassistant
            service: homeassistant
            severity: warning
        - alert: HomeAssistantPodRestarting
          annotations:
            description: Home Assistant pod {{ $labels.pod }} has restarted more than 2 times
              in the last hour.
            summary: Home Assistant pod restarting frequently
          expr: increase(kube_pod_container_status_restarts_total{pod=~"home-assistant.*",
            namespace="home-automation"}[1h]) > 2
          for: 0m
          labels:
            component: homeassistant
            service: homeassistant
            severity: warning
        - alert: HomeAssistantConfigPVHighUsage
          annotations:
            description: Home Assistant config volume {{ $labels.persistentvolumeclaim }}
              usage is above 80%.
            summary: Home Assistant config volume high usage
          expr: |
            (
              kubelet_volume_stats_used_bytes{
                persistentvolumeclaim=~".*home-assistant.*",
                namespace="home-automation"
              }
              /
              kubelet_volume_stats_capacity_bytes{
                persistentvolumeclaim=~".*home-assistant.*",
                namespace="home-automation"
              }
            ) * 100 > 80
          for: 2m
          labels:
            component: homeassistant
            service: homeassistant
            severity: warning
            volume_type: config
        - alert: HomeAssistantConfigSyncCronJobStaleSuccess
          annotations:
            description: CronJob homeassistant-config-sync has not reported a successful run
              in more than 36 hours.
            summary: Home Assistant config sync CronJob has stale successful runs
          expr: |
            (
              time() - kube_cronjob_status_last_successful_time{
                namespace="home-automation",
                cronjob="homeassistant-config-sync"
              }
            ) > 129600
            and
            kube_cronjob_spec_suspend{
              namespace="home-automation",
              cronjob="homeassistant-config-sync"
            } == 0
          for: 30m
          labels:
            component: homeassistant
            service: homeassistant
            severity: warning
            workload: homeassistant-config-sync
        - alert: HomeAssistantConfigSyncCronJobMissedSchedule
          annotations:
            description: CronJob homeassistant-config-sync next schedule timestamp is overdue
              by more than 1 hour.
            summary: Home Assistant config sync CronJob is missing schedules
          expr: |
            (
              time() - kube_cronjob_next_schedule_time{
                namespace="home-automation",
                cronjob="homeassistant-config-sync"
              }
            ) > 3600
            and
            kube_cronjob_spec_suspend{
              namespace="home-automation",
              cronjob="homeassistant-config-sync"
            } == 0
          for: 15m
          labels:
            component: homeassistant
            service: homeassistant
            severity: critical
            workload: homeassistant-config-sync
