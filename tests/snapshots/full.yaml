apiVersion: batch/v1
kind: CronJob
metadata:
  name: homeassistant-config-sync
  namespace: home-automation
  labels:
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: homeassistant-config-sync
    app.kubernetes.io/part-of: home-automation
    app.kubernetes.io/version: 2026.2.3
    helm.sh/chart: home-assistant-0.0.15
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cronjob
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: homeassistant-config-sync
            app.kubernetes.io/part-of: home-automation
            app.kubernetes.io/version: 2026.2.3
            helm.sh/chart: home-assistant-0.0.15
        spec:
          
          terminationGracePeriodSeconds: 30
          securityContext:
            fsGroup: 20020
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: homeassistant-config-sync
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: home-assistant
                topologyKey: kubernetes.io/hostname
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: sync
              image: ghcr.io/runlix/git:0.1.0-stable@sha256:5c1997f8a59433de06445ae19cfa3168573b144644890028962cf3f7105b2b62
              imagePullPolicy: IfNotPresent
              args:
                - sync-push
              env:
                - name: REPO_URL
                  value: https://github.com/orhayoun-eevee/ha-config.git
                - name: REPO_REF
                  value: main
                - name: WORK_DIR
                  value: /work
                - name: GITHUB_APP_ID
                  value: "2957635"
                - name: GITHUB_APP_INSTALLATION_ID
                  value: "112668720"
                - name: GITHUB_APP_PRIVATE_KEY_FILE
                  value: /etc/github-app/private-key.pem
                - name: ALLOWLIST_FILES
                  value: configuration.yaml,automations.yaml,scripts.yaml,scenes.yaml
                - name: ALLOWLIST_DIRS
                  value: packages,themes,www,blueprints,custom_components
                - name: DENYLIST_PATHS
                  value: secrets.yaml,.storage,home-assistant_v2.db,home-assistant.log,deps,tts,cloud,ssh,custom_components/spook_inverse
                - name: GIT_AUTHOR_NAME
                  value: homeassistant-sync-bot
                - name: GIT_AUTHOR_EMAIL
                  value: homeassistant-sync-bot@orhayoun.local
                - name: COMMIT_MESSAGE_TEMPLATE
                  value: homeassistant config sync ({{ref}} @ {{timestamp}})
              volumeMounts:
                - mountPath: /config
                  name: config
                  readOnly: true
                - mountPath: /etc/github-app
                  name: homeassistant-github-app
                  readOnly: true
                - mountPath: /work
                  name: work
                - mountPath: /tmp
                  name: tmp
              resources:
                limits:
                  cpu: 200m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                appArmorProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                  - ALL
                privileged: false
                readOnlyRootFilesystem: true
                runAsGroup: 20020
                runAsNonRoot: true
                runAsUser: 20020
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: config
              persistentVolumeClaim:
