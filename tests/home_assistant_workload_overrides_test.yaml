suite: home-assistant workload overrides
templates:
  - templates/all.yaml
tests:
  - it: enables host networking by default
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.hostNetwork
          value: true
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.dnsPolicy
          value: ClusterFirstWithHostNet

  - it: allows host networking to be disabled explicitly
    set:
      application:
        workload:
          spec:
            hostNetwork: false
            dnsPolicy: ClusterFirst
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.hostNetwork
          value: false
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.dnsPolicy
          value: ClusterFirst

  - it: applies deployment replica override
    set:
      application:
        workload:
          spec:
            replicas: 2
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.replicas
          value: 2

  - it: applies pod security context fsGroup override
    set:
      application:
        workload:
          spec:
            podSecurityContext:
              fsGroup: 2000
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000

  - it: applies persistence pvc size override
    set:
      application:
        persistence:
          claims:
            config:
              size: 20Gi
    asserts:
      - documentSelector:
          path: metadata.name
          value: home-assistant-config
        equal:
          path: spec.resources.requests.storage
          value: 20Gi

  - it: applies container security context runAsUser override
    set:
      application:
        workload:
          spec:
            containers:
              home-assistant:
                securityContext:
                  runAsUser: 20021
              hass-configurator:
                enabled: false
              matter-server:
                enabled: false
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 20021
