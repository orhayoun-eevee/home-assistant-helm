suite: home-assistant chart contract
templates:
  - templates/all.yaml
tests:
  - it: renders main ingress route and service defaults
    asserts:
      - documentSelector:
          path: metadata.name
          value: home-assistant-route
        equal:
          path: spec.hostnames[0]
          value: homeassistant.orhayoun.com
      - documentSelector:
          path: metadata.name
          value: home-assistant-http
        equal:
          path: spec.ports[0].port
          value: 8123

  - it: wires deployment and config pvc defaults
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[0].name
          value: home-assistant
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8123
      - documentSelector:
          path: metadata.name
          value: home-assistant-config
        equal:
          path: spec.resources.requests.storage
          value: 10Gi

  - it: keeps minimal scenario render deterministic
    values:
      - scenarios/minimal.yaml
    asserts:
      - hasDocuments:
          count: 8

  - it: applies route host override
    set:
      application:
        network:
          httpRoute:
            routes:
              - name: route
                enabled: true
                listener:
                  sectionName: https
                hostnames:
                  - hass.internal.example
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: home-assistant-http
                        port: 8123
                        weight: 100
                        group: ""
                        kind: Service
    asserts:
      - documentSelector:
          path: metadata.name
          value: home-assistant-route
        equal:
          path: spec.hostnames[0]
          value: hass.internal.example

  - it: supports route-level hostnames for split domains
    set:
      application:
        network:
          httpRoute:
            host: homeassistant.orhayoun.com
            routes:
              - name: route
                enabled: true
                listener:
                  sectionName: https
                hostnames:
                  - homeassistant.orhayoun.com
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: home-assistant-http
                        port: 8123
                        weight: 100
                        group: ""
                        kind: Service
              - name: http-redirect
                enabled: true
                listener:
                  sectionName: http
                hostnames:
                  - homeassistant.orhayoun.com
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    filters:
                      - type: RequestRedirect
                        requestRedirect:
                          scheme: https
                          statusCode: 301
              - name: configurator
                enabled: true
                listener:
                  sectionName: https
                hostnames:
                  - configurator-homeassistant.orhayoun.com
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: home-assistant-configurator
                        port: 3218
                        weight: 1
                        group: ""
                        kind: Service
              - name: configurator-http-redirect
                enabled: true
                listener:
                  sectionName: http
                hostnames:
                  - configurator-homeassistant.orhayoun.com
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    filters:
                      - type: RequestRedirect
                        requestRedirect:
                          scheme: https
                          statusCode: 301
    asserts:
      - documentSelector:
          path: metadata.name
          value: home-assistant-route
        equal:
          path: spec.hostnames[0]
          value: homeassistant.orhayoun.com
      - documentSelector:
          path: metadata.name
          value: home-assistant-http-redirect
        equal:
          path: spec.hostnames[0]
          value: homeassistant.orhayoun.com
      - documentSelector:
          path: metadata.name
          value: home-assistant-configurator-http-redirect
        equal:
          path: spec.hostnames[0]
          value: configurator-homeassistant.orhayoun.com
