checks:
  doNotAutoAddDefaults: false
  include:
    - no-liveness-probe
    - no-readiness-probe
    - no-rolling-update-strategy
    - default-service-account
    - non-isolated-pod
    - minimum-three-replicas
    - cluster-admin-role-binding
    - access-to-secrets
    - read-secret-from-env-var
  exclude:
    # Home Assistant is commonly operated as a single replica deployment.
    - minimum-three-replicas
    # Stateful Home Assistant upgrades are intentionally serialized.
    - no-rolling-update-strategy
    # Home Assistant currently defaults to host networking for discovery compatibility.
    - host-network
    # sync CronJob is a short-lived batch workload; probes are not rendered by current lib-chart cronjob container schema.
    - no-liveness-probe
    - no-readiness-probe
    # sync CronJob intentionally omits ttlSecondsAfterFinished to avoid conflicts with history controls.
    - job-ttl-seconds-after-finished
